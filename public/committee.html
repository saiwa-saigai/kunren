  h+=`</div>`;
  if(state.mode==="list"){
    h+=`<div class="scroll"><table class="tl"><tr><th>時刻</th><th>部署</th><th>主な動き</th><th>場所</th></tr>`;
    let prev="";
    D.alltl.forEach(r=>{
      if(state.dept&&r.dept!==state.dept)return;
      h+=`<tr class="lk ${r.t!==prev?'new':''}" data-d="${esc(r.dept)}" data-j="${r.sj}"><td class="tm">${r.t!==prev?esc(r.t):''}</td><td class="dp"><i class="dot" style="--c:${col(r.dept)};display:inline-block;margin-right:6px"></i><u>${esc(r.dept)}</u></td><td><b>${esc(r.title)}</b>：${esc(r.act)}</td><td>${esc(r.place)}</td></tr>`;prev=r.t});
    h+=`</table></div>`;
  }else{
    const times=[];D.alltl.forEach(r=>{if(!times.includes(r.t))times.push(r.t)});
    h+=`<div class="mx"><table><tr><th style="--c:#999;cursor:default;left:0;z-index:2">時刻</th>`+names.map(n=>`<th style="--c:${col(n)}" data-hd="${esc(n)}">${esc(n)}</th>`).join("")+`</tr>`;
    times.forEach(t=>{
      h+=`<tr><td class="tm">${esc(t)}</td>`;
      names.forEach(n=>{
        const cs=D.alltl.filter(r=>r.t===t&&r.dept===n);
        h+=`<td>`+cs.map(r=>`<a class="cell" style="--c:${col(n)}" data-d="${esc(n)}" data-j="${r.sj}">${esc(r.title)}</a>`).join("")+`</td>`});
      h+=`</tr>`});
    h+=`</table></div>`;
  }
  $("#main").innerHTML=h;
  $("#main").querySelectorAll(".seg button").forEach(b=>b.onclick=()=>{state.mode=b.dataset.m;alltl()});
  $("#main").querySelectorAll(".chip[data-d]").forEach(b=>b.onclick=()=>{state.dept=b.dataset.d;alltl()});
  $("#main").querySelectorAll("tr.lk").forEach(t=>t.onclick=()=>go("d:"+t.dataset.d,+t.dataset.j));
  $("#main").querySelectorAll("a.cell").forEach(t=>t.onclick=()=>go("d:"+t.dataset.d,+t.dataset.j));
  $("#main").querySelectorAll("th[data-hd]").forEach(t=>t.onclick=()=>go("d:"+t.dataset.hd));
}
function nameInput(i){return `<input type="text" data-i="${i}" value="${esc(store[i]||"")}" placeholder="氏名">`}
function bindNames(r){r.querySelectorAll("input[data-i]").forEach(i=>i.addEventListener("input",()=>{store[i.dataset.i]=i.value;save()}))}
function dept(n){
  const s=D.scripts[n],c=col(n);
  let h=`<div style="--c:${c}"><h1><i class="dot" style="--c:${c};display:inline-block;margin-right:10px"></i>${esc(n)}</h1><p class="sub">部署別台本</p>
  <h2>配役表</h2><div class="scroll"><table><tr><th>役名</th><th>役割</th><th>氏名</th></tr>`;
  D.roster.forEach((r,i)=>{if(r.dept===n)h+=`<tr><td class="r" style="color:${c}">${esc(r.role)}</td><td>${esc(r.what)}</td><td class="n">${nameInput(i)}</td></tr>`});
  h+=`</table></div><h2>台本</h2>`;
  s.scenes.forEach(sc=>{
    h+=`<section class="scene" id="sc${s.scenes.indexOf(sc)}"><header><span class="tm">${esc(sc.t)}</span><span class="tt">${esc(sc.title)}</span><span class="pl">${esc(sc.place)}</span></header>`;
    if(sc.sit)h+=`<div class="sit">${esc(sc.sit)}</div>`;
    sc.acts.forEach(a=>{h+=`<div class="act"><div class="w">${esc(a[0])}</div><div class="d">${esc(a[1])}</div></div>`});
    h+=`</section>`});
  $("#main").innerHTML=h+`</div>`;bindNames($("#main"));
}
const GR=["進行","災害対策本部","現地統括本部","各部署","特別な役"];
function roster(){
  let h=`<h1>全体配役表</h1><p class="sub">氏名を入力できます。入力した内容は、このパソコンに残ります。</p><div class="bar"><input type="search" id="q" placeholder="役名・部署で検索" value="${esc(state.q)}"><button class="chip ${state.g===""?'on':''}" data-g="">すべて</button>`+GR.map(g=>`<button class="chip ${state.g===g?'on':''}" data-g="${g}">${g}</button>`).join("")+`<button class="btn" id="cp">入力した氏名をコピー</button></div><div class="scroll"><table><tr><th>区分</th><th>部署</th><th>役名</th><th>主な動き</th><th>時刻</th><th>氏名</th></tr>`;
  const q=state.q.trim();
  D.roster.forEach((r,i)=>{if(state.g&&r.g!==state.g)return;if(q&&!(r.role+r.dept+r.what+r.g).includes(q))return;
    h+=`<tr><td>${esc(r.g)}</td><td><i class="dot" style="--c:${col(r.dept)};display:inline-block;margin-right:6px"></i>${esc(r.dept)}</td><td class="r">${esc(r.role)}</td><td>${esc(r.what)}</td><td>${esc(r.time)}</td><td class="n">${nameInput(i)}</td></tr>`});
  $("#main").innerHTML=h+`</table></div>`;bindNames($("#main"));
  $("#q").oninput=e=>{state.q=e.target.value;const p=e.target.selectionStart;roster();const x=$("#q");x.focus();x.setSelectionRange(p,p)};
  $("#main").querySelectorAll(".chip[data-g]").forEach(b=>b.onclick=()=>{state.g=b.dataset.g;roster()});
  $("#cp").onclick=function(){const t=D.roster.map((r,i)=>store[i]?`${r.dept||r.g}／${r.role}：${store[i]}`:"").filter(Boolean).join("\n")||"（入力はまだありません）";
    const done=()=>{this.textContent="コピーしました";setTimeout(()=>{this.textContent="入力した氏名をコピー"},1500)};
    const fb=()=>{const x=document.createElement("textarea");x.value=t;document.body.appendChild(x);x.select();try{document.execCommand("copy");done()}catch(e){}x.remove()};
    if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(t).then(done,fb);else fb();};
}
function render(){nav();
  if(view==="home")home();else if(view==="assume")assume();else if(view==="timeline")timeline();else if(view==="alltl")alltl();else if(view==="roster")roster();else if(view.startsWith("d:"))dept(view.slice(2));else home();
  $("#main").querySelectorAll(".card[data-v]").forEach(b=>b.onclick=()=>go(b.dataset.v));}
render();
</script>

</html>
