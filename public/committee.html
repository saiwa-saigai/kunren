const u8=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function dec(p){
  const km=await crypto.subtle.importKey("raw",new TextEncoder().encode(p),"PBKDF2",false,["deriveKey"]);
  const k=await crypto.subtle.deriveKey({name:"PBKDF2",salt:u8(S),iterations:IT,hash:"SHA-256"},km,{name:"AES-GCM",length:256},false,["decrypt"]);
  const r=await crypto.subtle.decrypt({name:"AES-GCM",iv:u8(V)},k,u8(C));
  return new TextDecoder().decode(r);
}

function show(name,html){
