const u8=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function dec(p){
  const km=await crypto.subtle.importKey("raw",new TextEncoder().encode(p),"PBKDF2",false,["deriveKey"]);
  const k=await crypto.subtle.deriveKey({name:"PBKDF2",salt:u8(S),iterations:IT,hash:"SHA-256"},km,{name:"AES-GCM",length:256},false,["decrypt"]);
  const r=await crypto.subtle.decrypt({name:"AES-GCM",iv:u8(V)},k,u8(C));
  return new TextDecoder().decode(r);
}
const $=i=>document.getElementById(i);
function open2(html){document.open();document.write(html);document.close()}
function show(name,html){
  $("f").style.display="none";$("wn").textContent=name+"さん、ようこそ";$("w").style.display="block";
  setTimeout(()=>open2(html),1000);
}
let nm="";try{nm=localStorage.getItem("drill_user")||""}catch(e){}
$("n").value=nm;
try{const k=sessionStorage.getItem("drill_k");if(k&&nm&&window.crypto&&crypto.subtle){dec(k).then(h=>{$("f").style.display="none";open2(h)}).catch(()=>{try{sessionStorage.removeItem("drill_k")}catch(e){}})}}catch(e){}
if(!(window.crypto&&crypto.subtle)){$("e").textContent="このブラウザでは開けません。Chrome または Edge をお使いください。";$("b").disabled=true}
$("f").onsubmit=async ev=>{
  ev.preventDefault();const name=$("n").value.trim(),p=$("p").value;$("e").textContent="";$("b").disabled=true;
  try{const h=await dec(p);
    try{localStorage.setItem("drill_user",name);sessionStorage.setItem("drill_k",p)}catch(e){}
    show(name,h);
  }catch(e){$("e").textContent="合言葉が違います。";$("b").disabled=false}
};
})();
