  setTimeout(()=>open2(html),1000);
}
try{const k=sessionStorage.getItem("drill_k");if(k&&window.crypto&&crypto.subtle){dec(k).then(h=>{$("f").style.display="none";open2(h)}).catch(()=>{try{sessionStorage.removeItem("drill_k")}catch(e){}})}}catch(e){}
if(!(window.crypto&&crypto.subtle)){$("e").textContent="このブラウザでは開けません。Chrome または Edge をお使いください。";$("b").disabled=true}
$("f").onsubmit=async ev=>{
  ev.preventDefault();const p=$("p").value;$("e").textContent="";$("b").disabled=true;
  try{const h=await dec(p);
    try{sessionStorage.setItem("drill_k",p);localStorage.setItem("pub_k","1025")}catch(e){}
    show(h);
  }catch(e){$("e").textContent="合言葉が違います。";$("b").disabled=false}
};
})();
