try{const k=localStorage.getItem(KEY);if(k&&window.crypto&&crypto.subtle){$("f").style.display="none";dec(k).then(h=>open2(h)).catch(()=>{$("f").style.display="";try{localStorage.removeItem(KEY)}catch(e){}})}}catch(e){}
if(!(window.crypto&&crypto.subtle)){$("e").textContent="このブラウザでは開けません。Chrome または Edge をお使いください。";$("b").disabled=true}
$("f").onsubmit=async ev=>{
  ev.preventDefault();const p=$("p").value.trim();$("e").textContent="";$("b").disabled=true;
  try{const h=await dec(p);try{localStorage.setItem(KEY,p)}catch(e){}open2(h)}
  catch(e){$("e").textContent="合言葉が違います。";$("b").disabled=false}
};
})();
</script></body></html>
