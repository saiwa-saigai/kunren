<style>
:root{color-scheme:light;--bg:#f6f7f5;--card:#ffffff;--fg:#1f2a28;--mute:#68746f;--line:#dbe1dd;--acc:#0f766e;--acc-bg:#e3f2ef;--warn:#b45309;--inp:#ffffff;--ok:#15803d}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font:15px/1.6 "Hiragino Sans","Yu Gothic UI","Noto Sans JP",sans-serif;padding-block:0 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:880px;margin:0 auto}
header{padding:20px 0 8px}
h1{font-size:20px;margin:0;letter-spacing:.02em;text-wrap:balance}
.sub{color:var(--mute);font-size:13px;margin:4px 0 0}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding:8px 0;border-bottom:1px solid var(--line);display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.tab,.chip{border:1px solid var(--line);background:var(--card);color:var(--fg);padding:6px 14px;border-radius:999px;font:inherit;font-size:14px;cursor:pointer}
.tab[aria-pressed="true"],.chip[aria-pressed="true"]{background:var(--acc);border-color:var(--acc);color:#fff}
.stat{margin-left:auto;font-size:13px;color:var(--mute)}
.stat b{color:var(--fg)}
#st.ok{color:var(--ok)} #st.err{color:var(--warn)}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:12px 0 4px}
.chip{font-size:13px;padding:4px 11px}
section.dept{margin-top:20px}
h2{font-size:15px;margin:0 0 6px;padding-left:10px;border-left:4px solid var(--acc)}
.rows{background:var(--card);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.r{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,190px);gap:4px 10px;padding:9px 12px;border-top:1px solid var(--line);align-items:center}
.r:first-child{border-top:0}
.t{font-size:12px;color:var(--mute);font-variant-numeric:tabular-nums}
.n{font-weight:600;min-width:0;overflow-wrap:anywhere}
.subh{padding:6px 12px;font-weight:700;font-size:13px;background:var(--acc-bg);border-top:1px solid var(--line)}
.wi{grid-column:1;min-width:0}.wi textarea,.wi input{resize:none;overflow:hidden;line-height:1.5;width:100%;font:inherit;font-size:12.5px;color:var(--mute);padding:4px 7px;border:1px solid var(--line);border-radius:6px;background:var(--inp)}.wi textarea:focus,.wi input:focus{color:var(--fg);outline:2px solid var(--acc)}
.w{grid-column:1;font-size:12.5px;color:var(--mute);min-width:0;overflow-wrap:anywhere}
.r>input{grid-column:2;grid-row:1/span 2;width:100%;font:inherit;padding:7px 9px;border:1px solid var(--line);border-radius:7px;background:var(--inp);color:var(--fg);min-width:0}
.r>input:focus{outline:2px solid var(--acc);outline-offset:0}
.r>input[readonly]{background:transparent;border-color:transparent}
@media (max-width:560px){.r{grid-template-columns:minmax(0,1fr)}.r>input{grid-column:1/-1;grid-row:auto}.w,.wi{grid-column:1}}
table{width:100%;border-collapse:collapse;background:var(--card);border:1px solid var(--line);border-radius:10px;overflow:hidden;font-size:14px}
th,td{padding:7px 10px;border-top:1px solid var(--line);text-align:left;vertical-align:top;overflow-wrap:anywhere}
th{background:var(--acc-bg);font-size:12px;color:var(--mute);border-top:0}
tr.sh td{background:var(--acc-bg);font-weight:600;font-size:13px}
td.u{color:var(--mute)}
td.in{padding:4px 6px}
td.in input{width:100%;font:inherit;padding:6px 8px;border:1px solid var(--line);border-radius:7px;background:var(--inp);color:var(--fg);min-width:0}
td.in input:focus{outline:2px solid var(--acc)}
td.in input[readonly]{background:transparent;border-color:transparent}
.r.empty input,td.in.empty input{border-style:dashed}
.scroll{overflow-x:auto}
.note{font-size:13px;color:var(--mute);margin:10px 0}
.note.warn{color:var(--warn)}
</style>

"hist": [["11月18日", "災害対策本部（仮本部）の場所を本館1階食堂に、看護学生の集合・待機場所を北館2階会議室に入れ替えた。牧信子・岡本真紀・市野浩美と、検査技師3名（間部優斗・山田恭輔・中村倖菜）の氏名を入れた。"], ["11月17日", "栄養科の役を、栄養科責任者・栄養科スタッフ①・厨房マネージャー・厨房調理師①に整理した。栄養科の朝食を「4階東病棟の配膳車のみ厨房内」に変更し、配膳車の運搬、食器の回収、給水の使いみちの判断を追加した。初動アクションカードの文言を「初動AC提出」に統一し、新設部門リーダーの役割とベッドコントロールの文言、現地統括の役割の文言を見直した。"], ["11月12日", "全体配役表と名簿を、最新のExcelにした。薬剤部本部員は岡本薬剤部長だけにした。出席が未定の副部長・看護師長は、副部長A・B、看護師長Aにした。"], ["11月8日", "全体配役表と名簿を、委員会の名簿（Excel）の内容にした。現地統括スタッフを⑥まで増やし、全体配役表の時刻の列をなくした。"], ["11月4日（夜）", "病院コーディネーターの記載をやめ、本部にまとめた。8:00の放送文、初動アクションカードの回収（当直・早出の部署は委員が持参、病棟は管理当直役が回収）、9:45の入電、10:15の転院搬送の要請を見直した。配役表で、各部署の個々の部署に絞れるようにした。ログインは合言葉だけにした。"], ["11月4日（夜）", "組織図をBCPの体制図にならって作り直した。現地リーダーを現地統括リーダーに改め、「係のない」を「参集後に割り当てられた人」に改めた。事務部の部署名を整えた。"], ["11月4日", "組織図を別ページにし、枠の構成を見直した。本部員、現地統括スタッフ、ゾーンスタッフを追加。仮設トイレ担当と配膳の手伝いを廃止。余震の報告先を本部にした。役割札と集合場所を追加。"], ["11月4日", "台本を見直した。報告の時刻と初動アクションカードの流れをそろえ、本部ロジと現地統括ロジを各2名にした。管理当直役、余震、組織図を追加。"], ["11月4日", "部署別台本に、災害対策本部と現地統括本部を追加。"], ["11月3日", "委員用サイトに、お名前と合言葉で開くログインを追加。台本PDFの公開を停止。"], ["11月3日", "一般参加者用サイトとBCPダイジェスト版を追加。タイムライン（全部署）に表の表示を追加。栄養科の朝食は配膳済みに変更。台本PDFにQRコードを追加。"], ["11月2日", "委員用サイト、台本PDF、議題を公開。"]], "assume": [["日時", "令和9年3月6日（土）午前。外来と予定手術はありません。"], ["発災", "7:30。和歌山市で震度6弱。（レベル3を想定）"], ["院内の状況", "停電・断水。復旧の見込みなし。自家発電で供給します。"], ["朝食", "7:30の時点で、4階東病棟以外の4病棟は、配膳が済んでいます。4階東病棟の配膳車だけが、厨房に残っています。"], ["運転時間の目安", "フル稼働のとき、地下2階 約12.5時間、本館5階 約23時間、北館 約12時間。節電で延びます。"], ["燃料・給水", "燃料・給水の依頼先は、自治体・酒直。依頼は、EMISにも入力します。供給は明日の見込みです。"], ["電子カルテ", "使えません。紙で運用します。"], ["通信", "PHS、トランシーバーが使えます。北館2階の衛星回線、防災センターのワイドスターが使えます。"], ["場所", "災害対策本部：本館1階食堂。現地統括本部：本館1階 受付会計前ロビー。トリアージセンター：総合案内前ロビー。赤・黄ゾーン：外来の診察室前。一般参加者の集合・待機場所：外来の診察室前。看護学生の集合・待機場所：北館2階会議室。"], ["時間", "7:30〜8:00は、まだ訓練は始まっていません。この間の対応は、当直者や管理当直が行ったものとします。"], ["初動アクションカード", "各部署に貼ってあります。各部署の委員が、8:00に本部へ提出します。"], ["余震", "9:15。震度5弱。院内放送で伝えます。各部署は、安全を確認し、被害の有無を本部へ報告します。"], ["傷病者の来院", "9:00、9:30、10:00の3回。"], ["本部会議", "10:30の1回。参加者は、本部長、本部ロジ、現地統括リーダー、新設部門リーダーです。"], ["トイレ", "節水のため、トイレは使用禁止とし、すみやかに仮設トイレを設置する。"], ["参加者", "看護学生 約20名（傷病者役
